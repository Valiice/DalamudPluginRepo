name: Update Repo JSON (Dispatch)

on:
  repository_dispatch:
    types: [ plugin-release ]

permissions:
  contents: write

concurrency:
  group: update-plugins
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch Plugin Manifest
        run: |
          PLUGIN="${{ github.event.client_payload.plugin }}"
          TAG="${{ github.event.client_payload.tag }}"
          REPO="${{ github.event.client_payload.repo }}"

          # Try to fetch manifest from the tagged release (most accurate)
          MANIFEST_URL="https://raw.githubusercontent.com/${REPO}/${TAG}/${PLUGIN}/${PLUGIN}.json"

          echo "Fetching manifest from: $MANIFEST_URL"
          if curl -sf "$MANIFEST_URL" -o plugin-manifest.json; then
            echo "Successfully fetched manifest from tag"
          else
            # Fallback to master branch if tag doesn't exist yet
            echo "Tag not found, trying master branch"
            MANIFEST_URL="https://raw.githubusercontent.com/${REPO}/master/${PLUGIN}/${PLUGIN}.json"
            curl -sf "$MANIFEST_URL" -o plugin-manifest.json || echo "{}" > plugin-manifest.json
          fi

          # Extract metadata from manifest
          echo "ICON_URL=$(jq -r '.IconUrl // ""' plugin-manifest.json)" >> $GITHUB_ENV
          echo "DESCRIPTION=$(jq -r '.Description // ""' plugin-manifest.json)" >> $GITHUB_ENV
          echo "PUNCHLINE=$(jq -r '.Punchline // ""' plugin-manifest.json)" >> $GITHUB_ENV

      - name: Update repo.json
        run: |
          PLUGIN="${{ github.event.client_payload.plugin }}"
          VERSION="${{ github.event.client_payload.version }}"
          TAG="${{ github.event.client_payload.tag }}"
          REPO="${{ github.event.client_payload.repo }}"
          CHANGELOG="${{ github.event.client_payload.changelog }}"
          TIMESTAMP=$(date +%s)

          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${PLUGIN}.zip"

          jq --arg plugin "$PLUGIN" \
             --arg version "$VERSION" \
             --arg url "$DOWNLOAD_URL" \
             --arg changelog "$CHANGELOG" \
             --arg iconUrl "$ICON_URL" \
             --arg description "$DESCRIPTION" \
             --arg punchline "$PUNCHLINE" \
             --argjson timestamp "$TIMESTAMP" \
             'map(if .InternalName == $plugin then
               .AssemblyVersion = $version |
               .DownloadLinkInstall = $url |
               .DownloadLinkTesting = $url |
               .DownloadLinkUpdate = $url |
               .Changelog = $changelog |
               .LastUpdate = $timestamp |
               (if $iconUrl != "" then .IconUrl = $iconUrl else . end) |
               (if $description != "" then .Description = $description else . end) |
               (if $punchline != "" then .Punchline = $punchline else . end)
             else . end)' repo.json > repo.tmp.json && mv repo.tmp.json repo.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ${{ github.event.client_payload.plugin }} to ${{ github.event.client_payload.tag }}"
            git push
          fi
